<div
  class="draggable-modal-mask"
  [class.fullscreen]="isFullscreen"
  [class.hidden]="!showMask()"
  [ngStyle]="getMaskStyle()"
  [style.z-index]="getZIndex()"
>
  <div
    #modalContainer
    class="draggable-modal-container"
    [class.dragging]="isDragging"
    [class.resizing]="isResizing"
    [class.fullscreen]="isFullscreen"
    [class.compact]="!hasContent()"
    [class]="config?.nzClassName || ''"
    [ngClass]="getWrapClassName()"
    [ngStyle]="config?.nzStyle"
    [attr.dir]="getDirection()"
  >
    <!-- 标题栏 -->
    <div
      #modalHeader
      class="modal-header"
      (mousedown)="isDraggable() ? onDragStart($event) : null"
      [class.no-drag]="isFullscreen || !isDraggable()"
    >
      <div
        class="modal-title"
        [title]="getTitleTooltip()"
        [innerHTML]="config?.nzTitle || '提示'">
      </div>
      <div class="modal-controls">
        <button
          type="button"
          class="control-btn minimize-btn"
          (click)="minimize()"
          title="最小化"
          *ngIf="showMinimizeButton()"
        >
          <i class="icon-minimize">−</i>
        </button>
        <button
          type="button"
          class="control-btn fullscreen-btn"
          (click)="toggleFullscreen()"
          [title]="isFullscreen ? '还原' : '全屏'"
          *ngIf="showFullscreenButton()"
        >
          <i class="icon-fullscreen" [class.restore]="isFullscreen">
            <svg viewBox="64 64 896 896" focusable="false" *ngIf="!isFullscreen" fill="currentColor" width="1em" height="1em" data-icon="fullscreen" aria-hidden="true"><path d="M290 236.4l43.9-43.9a8.01 8.01 0 00-4.7-13.6L169 160c-5.1-.6-9.5 3.7-8.9 8.9L179 329.1c.8 6.6 8.9 9.4 13.6 4.7l43.7-43.7L370 423.7c3.1 3.1 8.2 3.1 11.3 0l42.4-42.3c3.1-3.1 3.1-8.2 0-11.3L290 236.4zm352.7 187.3c3.1 3.1 8.2 3.1 11.3 0l133.7-133.6 43.7 43.7a8.01 8.01 0 0013.6-4.7L863.9 169c.6-5.1-3.7-9.5-8.9-8.9L694.8 179c-6.6.8-9.4 8.9-4.7 13.6l43.9 43.9L600.3 370a8.03 8.03 0 000 11.3l42.4 42.4zM845 694.9c-.8-6.6-8.9-9.4-13.6-4.7l-43.7 43.7L654 600.3a8.03 8.03 0 00-11.3 0l-42.4 42.3a8.03 8.03 0 000 11.3L734 787.6l-43.9 43.9a8.01 8.01 0 004.7 13.6L855 864c5.1.6 9.5-3.7 8.9-8.9L845 694.9zm-463.7-94.6a8.03 8.03 0 00-11.3 0L236.3 733.9l-43.7-43.7a8.01 8.01 0 00-13.6 4.7L160.1 855c-.6 5.1 3.7 9.5 8.9 8.9L329.2 845c6.6-.8 9.4-8.9 4.7-13.6L290 787.6 423.7 654c3.1-3.1 3.1-8.2 0-11.3l-42.4-42.4z"></path></svg>
            <svg viewBox="64 64 896 896" focusable="false" *ngIf="isFullscreen" fill="currentColor" width="1em" height="1em" data-icon="fullscreen-exit" aria-hidden="true"><path d="M391 240.9c-.8-6.6-8.9-9.4-13.6-4.7l-43.7 43.7L200 146.3a8.03 8.03 0 00-11.3 0l-42.4 42.3a8.03 8.03 0 000 11.3L280 333.6l-43.9 43.9a8.01 8.01 0 004.7 13.6L401 410c5.1.6 9.5-3.7 8.9-8.9L391 240.9zm10.1 373.2L240.8 633c-6.6.8-9.4 8.9-4.7 13.6l43.9 43.9L146.3 824a8.03 8.03 0 000 11.3l42.4 42.3c3.1 3.1 8.2 3.1 11.3 0L333.7 744l43.7 43.7A8.01 8.01 0 00391 783l18.9-160.1c.6-5.1-3.7-9.4-8.8-8.8zm221.8-204.2L783.2 391c6.6-.8 9.4-8.9 4.7-13.6L744 333.6 877.7 200c3.1-3.1 3.1-8.2 0-11.3l-42.4-42.3a8.03 8.03 0 00-11.3 0L690.3 279.9l-43.7-43.7a8.01 8.01 0 00-13.6 4.7L614.1 401c-.6 5.2 3.7 9.5 8.8 8.9zM744 690.4l43.9-43.9a8.01 8.01 0 00-4.7-13.6L623 614c-5.1-.6-9.5 3.7-8.9 8.9L633 783.1c.8 6.6 8.9 9.4 13.6 4.7l43.7-43.7L824 877.7c3.1 3.1 8.2 3.1 11.3 0l42.4-42.3c3.1-3.1 3.1-8.2 0-11.3L744 690.4z"></path></svg>
          </i>
        </button>
        <button
          type="button"
          class="control-btn close-btn"
          (click)="close()"
          title="关闭"
          *ngIf="isClosable()"
        >
          <ng-container *ngIf="config?.nzCloseIcon; else defaultCloseIcon">
            <ng-container *ngTemplateOutlet="config.nzCloseIcon"></ng-container>
          </ng-container>
          <ng-template #defaultCloseIcon>
            <i class="icon-close">
              <svg t="1761870809594" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="4724" width="1em" height="1em"><path d="M810.666667 273.493333L750.506667 213.333333 512 451.84 273.493333 213.333333 213.333333 273.493333 451.84 512 213.333333 750.506667 273.493333 810.666667 512 572.16 750.506667 810.666667 810.666667 750.506667 572.16 512z" p-id="4725"></path></svg>
            </i>
          </ng-template>
        </button>
      </div>
    </div>

    <!-- 内容区域 -->
    <div #modalContent class="modal-content">
      <!-- 内容主体区域 - 仅在有内容时显示 -->
      <div class="modal-body" *ngIf="hasContent()" [ngStyle]="config?.nzBodyStyle">
        <ng-container #dynamicComponentContainer></ng-container>
      </div>

      <!-- 全屏模式下无内容时的填充区域 -->
      <div class="modal-body-spacer" *ngIf="!hasContent() && isFullscreen"></div>

      <!-- 底部按钮区域 -->
      <div class="modal-footer" *ngIf="config?.nzFooter !== null">
        <!-- 自定义按钮数组 -->
        <ng-container *ngIf="isModalButtonArray(config?.nzFooter); else templateOrDefaultFooter">
          <button
            *ngFor="let button of config.nzFooter; trackBy: trackByButtonLabel"
            type="button"
            [class]="getButtonClass(button)"
            [disabled]="getButtonDisabled(button)"
            [style.display]="getButtonShow(button) ? 'inline-block' : 'none'"
            (click)="onCustomButtonClick(button)"
          >
            <span *ngIf="getButtonLoading(button)" class="loading-icon">⌛</span>
            {{ button.label }}
          </button>
        </ng-container>

        <!-- 模板或默认按钮 -->
        <ng-template #templateOrDefaultFooter>
          <ng-container *ngIf="config?.nzFooter; else defaultFooter">
            <ng-container *ngTemplateOutlet="config.nzFooter"></ng-container>
          </ng-container>
          <ng-template #defaultFooter>
            <button
              type="button"
              class="btn btn-default"
              (click)="cancel()"
              [disabled]="config?.nzCancelDisabled || config?.nzCancelLoading"
              *ngIf="config?.nzCancelText !== null"
            >
              <span *ngIf="config?.nzCancelLoading" class="loading-icon">⌛</span>
              {{ config?.nzCancelText || '取消' }}
            </button>
            <button
              type="button"
              [class]="getOkButtonClass()"
              (click)="confirm()"
              [disabled]="config?.nzOkDisabled || config?.nzOkLoading"
              *ngIf="config?.nzOkText !== null"
            >
              <span *ngIf="config?.nzOkLoading" class="loading-icon">⌛</span>
              {{ config?.nzOkText || '确定' }}
            </button>
          </ng-template>
        </ng-template>
      </div>
    </div>

    <!-- 调整大小的拖拽点 -->
    <div
      class="resize-handle resize-handle-top"
      (mousedown)="onResizeStart($event, 'top')"
      *ngIf="!isFullscreen && isResizable()"
    ></div>
    <div
      class="resize-handle resize-handle-right"
      (mousedown)="onResizeStart($event, 'right')"
      *ngIf="!isFullscreen && isResizable()"
    ></div>
    <div
      class="resize-handle resize-handle-bottom"
      (mousedown)="onResizeStart($event, 'bottom')"
      *ngIf="!isFullscreen && isResizable()"
    ></div>
    <div
      class="resize-handle resize-handle-left"
      (mousedown)="onResizeStart($event, 'left')"
      *ngIf="!isFullscreen && isResizable()"
    ></div>
    <div
      class="resize-handle resize-handle-corner-ne"
      (mousedown)="onResizeStart($event, 'corner')"
      *ngIf="!isFullscreen && isResizable()"
    ></div>
    <div
      class="resize-handle resize-handle-corner-nw"
      (mousedown)="onResizeStart($event, 'corner')"
      *ngIf="!isFullscreen && isResizable()"
    ></div>
    <div
      class="resize-handle resize-handle-corner-se"
      (mousedown)="onResizeStart($event, 'corner')"
      *ngIf="!isFullscreen && isResizable()"
    ></div>
    <div
      class="resize-handle resize-handle-corner-sw"
      (mousedown)="onResizeStart($event, 'corner')"
      *ngIf="!isFullscreen && isResizable()"
    ></div>
  </div>
</div>
